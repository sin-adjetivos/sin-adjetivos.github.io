name: Actualizar y publicar

on:
  push:
    branches: [main]
  schedule:
    # Hora UTC: unas 8:15, 14:15 y 21:15 en España.
    - cron: '15 7 * * *'
    - cron: '15 13 * * *'
    - cron: '15 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  issues: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Comprobar que no se publican borradores
        run: python -c "import json,sys; sys.exit(any(n.get('borrador') for n in json.load(open('site/src/data/noticias_propias.json',encoding='utf-8'))))"
      - name: Leer titulares
        run: python scripts/actualidad.py
      # Si esto falla, la web se publica igual.
      - name: Preparar el parte diario
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 7 * * *'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Europe/Madrid
        run: |
          python scripts/parte_diario.py > "$RUNNER_TEMP/parte.md"
          TITULO="Parte del $(date +%F)"
          gh issue list --state open --author "app/github-actions" --search "Parte del in:title" --json number,title --jq '.[] | "\(.number) \(.title)"' > "$RUNNER_TEMP/abiertos.txt"
          HECHO=""
          while read -r NUM RESTO; do
            if [ "$RESTO" = "$TITULO" ]; then HECHO="$NUM"; else gh issue close "$NUM" --reason "not planned" --comment "Sustituido por el parte de hoy."; fi
          done < "$RUNNER_TEMP/abiertos.txt"
          if [ -n "$HECHO" ]; then gh issue edit "$HECHO" --body-file "$RUNNER_TEMP/parte.md"
          else gh issue create --title "$TITULO" --body-file "$RUNNER_TEMP/parte.md" --assignee SrCapuchino; fi
      - name: Generar la web
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: despliegue
        uses: actions/deploy-pages@v4
      - name: Guardar los titulares en el historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json site/src/data/actualidad.json
          git diff --cached --quiet || git commit -m "Actualidad: titulares del $(date -u +%F\ %H:%M) UTC"
          # Si alguien ha subido cambios mientras tanto, los titulares se recolocan encima; en estos dos archivos manda esta ejecución, que es la más reciente.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 15
          done
          exit 1
