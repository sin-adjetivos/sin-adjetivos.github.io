<!doctype html><html><head><meta charset="utf-8"><style>
/* Logo: «sin» en Bricolage Grotesque y un trazo de rotulador en sepia donde iría el adjetivo. Se lee como una cara de expresión neutra. */
@font-face{font-family:bric;src:url(bricolage-grotesque-latin-standard-normal.woff2);font-weight:200 800;font-stretch:75% 100%}
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
#c{position:relative;overflow:hidden}
svg{display:block;position:absolute;left:0;top:0}
</style></head><body><div id="c"></div>
<script>
const SEPIA='#c4a982';
const TRAZO=(x,y,w,h,c,rot=-2)=>`<g transform="rotate(${rot} ${x+w/2} ${y+h/2})"><path fill="${c}" d="M${x+h*.25},${y+h*.18} C${x+w*.2},${y-h*.06} ${x+w*.45},${y+h*.1} ${x+w*.62},${y+h*.02} S${x+w*.92},${y-h*.05} ${x+w-h*.1},${y+h*.16} C${x+w+h*.12},${y+h*.3} ${x+w+h*.06},${y+h*.72} ${x+w-h*.16},${y+h*.86} C${x+w*.78},${y+h*1.04} ${x+w*.55},${y+h*.84} ${x+w*.34},${y+h*.96} S${x+h*.3},${y+h*1.06} ${x+h*.08},${y+h*.82} C${x-h*.14},${y+h*.62} ${x-h*.04},${y+h*.3} ${x+h*.25},${y+h*.18} Z"/></g>`;
// Marca en una caja de 360 × 360, centrada en el punto medio.
const MARCA=(letra,acento)=>`<text x="180" y="188" font-family="bric" font-size="176" font-weight="800" fill="${letra}" text-anchor="middle" letter-spacing="-3">sin</text>${TRAZO(74,214,212,40,acento)}`;
const v=new URLSearchParams(location.search).get('v');
const [W,H,fondo]={perfil:[1080,1080,'#000'],oscuro:[1080,1080,null],claro:[1080,1080,null],icono:[256,256,'#000'],banner:[1500,500,'#000'],og:[1200,630,'#000']}[v];
const c=document.getElementById('c'); Object.assign(c.style,{width:W+'px',height:H+'px',background:fondo||'transparent'});
let s='';
if(v==='perfil'||v==='oscuro'||v==='icono') s=`<svg width="${W}" height="${H}" viewBox="0 0 360 360">${MARCA('#fff',SEPIA)}</svg>`;
if(v==='claro') s=`<svg width="${W}" height="${H}" viewBox="0 0 360 360">${MARCA('#000',SEPIA)}</svg>`;
if(v==='banner'||v==='og'){
  const k=v==='og';
  const lado=k?430:410, x=k?60:70, y=(H-lado)/2, tx=k?500:500;
  s=`<svg width="${lado}" height="${lado}" viewBox="0 0 360 360" style="left:${x}px;top:${y}px">${MARCA('#fff',SEPIA)}</svg>
  <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
   <text x="${tx}" y="${k?290:245}" font-family="bric" font-size="${k?94:112}" font-weight="800" fill="#fff" letter-spacing="-2">Sin adjetivos</text>
   <text x="${tx+2}" y="${k?348:305}" font-family="bric" font-size="${k?29:33}" font-weight="500" fill="#fff">Lo que proponen, votan y dicen los partidos.</text>
   <text x="${tx+2}" y="${k?388:348}" font-family="bric" font-size="${k?29:33}" font-weight="500" fill="${SEPIA}">Con la fuente al lado.</text>
  </svg>`;
}
c.innerHTML=s;
</script></body></html>
